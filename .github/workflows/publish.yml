name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      # npm trusted publishing (OIDC, no token) needs npm >= 11.5.1; Node 20 ships npm 10
      - name: Update npm
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

      - name: Type check
        run: npm run typecheck --workspace=packages/quarkernel

      - name: Check bundle size
        run: npm run size --workspace=packages/quarkernel

      - name: Run tests
        run: npm test --workspace=packages/quarkernel --workspace=packages/react --workspace=packages/vue --workspace=packages/svelte

      # Determine npm tag based on version number
      # v1.x.x → tag "v1" (maintenance)
      # v2.x.x → tag "latest" (current)
      - name: Determine npm tag
        id: npm-tag
        run: |
          VERSION=$(node -p "require('./packages/quarkernel/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          if [[ "$VERSION" == 1.* ]]; then
            echo "tag=v1" >> $GITHUB_OUTPUT
            echo "📦 v1.x detected → publishing with tag 'v1'"
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "📦 v2.x detected → publishing with tag 'latest'"
          fi

      - name: Publish @quazardous/quarkernel
        run: |
          echo "Publishing @quazardous/quarkernel@${{ steps.npm-tag.outputs.version }} with tag '${{ steps.npm-tag.outputs.tag }}'"
          npm publish --workspace=packages/quarkernel --tag ${{ steps.npm-tag.outputs.tag }} --provenance --access public

      - name: Publish @quazardous/quarkernel-vue
        run: npm publish --workspace=packages/vue --tag ${{ steps.npm-tag.outputs.tag }} --provenance --access public
        continue-on-error: true

      - name: Publish @quazardous/quarkernel-react
        run: npm publish --workspace=packages/react --tag ${{ steps.npm-tag.outputs.tag }} --provenance --access public
        continue-on-error: true

      - name: Publish @quazardous/quarkernel-svelte
        run: npm publish --workspace=packages/svelte --tag ${{ steps.npm-tag.outputs.tag }} --provenance --access public
        continue-on-error: true
